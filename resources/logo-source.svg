  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#33383e" stroke-width="4"/>

  <!-- terminal prompt chevron -->
